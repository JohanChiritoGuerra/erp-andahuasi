<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  body{margin:0}
  a{color:#0a7a3c}
  a:hover{color:#075c2d}
  input{font:inherit}
  input::placeholder{color:var(--faint)}
  *{scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{width:0;height:0;display:none}
  nav,main,aside div{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  button{font:inherit}
</style>
</helmet>
<div style="{{ themeStyle }}">

  <sc-if value="{{ showScrim }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeDrawer }}" style="position:absolute;inset:0;z-index:20;background:var(--scrim)"></div>
  </sc-if>

  <aside ref="{{ asideRef }}" style="{{ sidebarStyle }}">
    <sc-if value="{{ flyoutOpen }}" hint-placeholder-val="{{ false }}">
      <div style="{{ flyoutStyle }}">
        <div style="padding:2px 8px 8px;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--faint)">{{ flyoutTitle }}</div>
        <div style="display:flex;align-items:center;gap:6px;padding:0 2px 8px">
          <label style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:3px;background:var(--field);color:var(--faint)" style-focus="border-color:var(--accent)">
            {{ searchIcon }}
            <input placeholder="{{ flyPlaceholder }}" value="{{ flyQuery }}" onChange="{{ onFlyQuery }}" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:12.5px;color:var(--text)" />
            <sc-if value="{{ hasFlyQuery }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ clearFlyQuery }}" title="Borrar búsqueda" style="display:flex;align-items:center;justify-content:center;width:20px;height:20px;flex-shrink:0;border:0;border-radius:3px;background:transparent;color:var(--text);cursor:pointer" style-hover="background:var(--hover);color:var(--accent)">{{ closeIcon }}</button>
            </sc-if>
          </label>
          <button onClick="{{ toggleFlyAll }}" title="Expandir o contraer todo" style="display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;border:1px solid var(--border);border-radius:3px;background:var(--field);color:var(--muted);cursor:pointer" style-hover="color:var(--text);background:var(--hover)">{{ flyExpandIcon }}</button>
        </div>
        <div style="flex:1;min-height:0;overflow-y:auto">
        <sc-if value="{{ flyAllMode }}" hint-placeholder-val="{{ false }}">
          <sc-for list="{{ flyModules }}" as="mod" hint-placeholder-count="4">
            <div style="margin-bottom:2px">
              <button onClick="{{ mod.toggle }}" style="display:flex;align-items:center;gap:9px;width:100%;padding:0 8px;height:32px;border:0;border-radius:3px;background:transparent;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;text-align:left" style-hover="background:var(--hover)">
                <span style="display:flex;flex-shrink:0;color:var(--icon)">{{ mod.icon }}</span>
                <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ mod.label }}</span>
                <sc-if value="{{ mod.hasCats }}" hint-placeholder-val="{{ true }}">
                  <span style="display:flex;flex-shrink:0;color:var(--hint)">{{ mod.caret }}</span>
                </sc-if>
              </button>
              <sc-if value="{{ mod.open }}" hint-placeholder-val="{{ false }}">
                <sc-for list="{{ mod.cats }}" as="cat" hint-placeholder-count="2">
                  <div>
                    <button onClick="{{ cat.toggle }}" style="display:flex;align-items:center;gap:9px;width:100%;padding:0 8px 0 22px;height:30px;border:0;border-radius:3px;background:transparent;font-size:12.5px;font-weight:600;color:var(--item);cursor:pointer;text-align:left" style-hover="background:var(--hover)">
                      <span style="display:flex;flex-shrink:0;color:var(--icon)">{{ cat.icon }}</span>
                      <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ cat.label }}</span>
                      <span style="display:flex;flex-shrink:0;color:var(--hint)">{{ cat.caret }}</span>
                    </button>
                    <sc-if value="{{ cat.open }}" hint-placeholder-val="{{ false }}">
                      <div style="display:flex;flex-direction:column;gap:1px">
                        <sc-for list="{{ cat.items }}" as="acc" hint-placeholder-count="2">
                          <button onClick="{{ acc.select }}" style="{{ acc.style }}" style-hover="background:var(--hover)">
                            <span style="{{ acc.dotStyle }}"></span>
                            <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ acc.label }}</span>
                            <sc-if value="{{ acc.showBadge }}" hint-placeholder-val="{{ false }}">
                              <span style="{{ acc.badgeStyle }}">{{ acc.badge }}</span>
                            </sc-if>
                          </button>
                        </sc-for>
                      </div>
                    </sc-if>
                  </div>
                </sc-for>
              </sc-if>
            </div>
          </sc-for>
        </sc-if>
        <sc-if value="{{ flyPerModule }}" hint-placeholder-val="{{ true }}">
        <sc-for list="{{ flyoutCats }}" as="cat" hint-placeholder-count="3">
          <div style="margin-bottom:6px">
            <button onClick="{{ cat.toggle }}" style="display:flex;align-items:center;gap:9px;width:100%;padding:0 8px;height:30px;border:0;border-radius:3px;background:transparent;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;text-align:left" style-hover="background:var(--hover)">
              <span style="display:flex;flex-shrink:0;color:var(--icon)">{{ cat.icon }}</span>
              <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ cat.label }}</span>
              <span style="display:flex;flex-shrink:0;color:var(--hint)">{{ cat.caret }}</span>
            </button>
            <sc-if value="{{ cat.open }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;flex-direction:column;gap:1px">
                <sc-for list="{{ cat.items }}" as="acc" hint-placeholder-count="2">
                  <button onClick="{{ acc.select }}" style="{{ acc.style }}" style-hover="background:var(--hover)">
                    <span style="{{ acc.dotStyle }}"></span>
                    <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ acc.label }}</span>
                    <sc-if value="{{ acc.showBadge }}" hint-placeholder-val="{{ false }}">
                      <span style="{{ acc.badgeStyle }}">{{ acc.badge }}</span>
                    </sc-if>
                  </button>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
        </sc-if>
        <sc-if value="{{ flyNoResults }}" hint-placeholder-val="{{ false }}">
          <div style="padding:10px 8px;font-size:12px;color:var(--faint)">Sin accesos que coincidan.</div>
        </sc-if>
        </div>
      </div>
    </sc-if>
    <div style="{{ brandRowStyle }}">
      <sc-if value="{{ showSidebarLogo }}" hint-placeholder-val="{{ true }}">
        <div role="img" aria-label="Andahuasi" style="{{ logoStyle }}"></div>
      </sc-if>
      <sc-if value="{{ showDesktopToggle }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ toggle }}" title="Contraer o expandir" style="{{ toggleStyle }}" style-hover="background:var(--hover);color:var(--text)">{{ railIcon }}</button>
      </sc-if>
    </div>

    <div style="display:flex;align-items:center;gap:6px;padding:12px 10px;border-bottom:1px solid var(--border);flex-shrink:0">
      <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}">
        <label style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:32px;padding:0 8px;border:1px solid var(--border);border-radius:3px;background:var(--field);color:var(--faint)" style-focus="border-color:var(--accent)">
          {{ searchIcon }}
          <input placeholder="Buscar accesos..." value="{{ query }}" onChange="{{ onQuery }}" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px;color:var(--text)" />
          <sc-if value="{{ hasQuery }}" hint-placeholder-val="{{ false }}">
            <button onClick="{{ clearQuery }}" title="Borrar búsqueda" style="display:flex;align-items:center;justify-content:center;width:22px;height:22px;flex-shrink:0;border:0;border-radius:3px;background:transparent;color:var(--text);cursor:pointer" style-hover="background:var(--hover);color:var(--accent)">{{ closeIcon }}</button>
          </sc-if>
        </label>
      </sc-if>
      <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ toggleAll }}" title="Expandir o contraer todo" style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;border:1px solid var(--border);border-radius:3px;background:var(--field);color:var(--muted);cursor:pointer" style-hover="color:var(--text);background:var(--hover)">{{ expandIcon }}</button>
      </sc-if>
      <sc-if value="{{ railMode }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ openAllFlyout }}" title="Buscar accesos" style="display:flex;align-items:center;justify-content:center;width:44px;height:32px;margin:0 auto;border:1px solid var(--border);border-radius:3px;background:var(--field);color:var(--muted);cursor:pointer" style-hover="color:var(--accent-text)">{{ searchIcon }}</button>
      </sc-if>
    </div>

    <nav style="flex:1;min-height:0;overflow-y:auto;padding:8px 10px 16px">
      <sc-for list="{{ modules }}" as="mod" hint-placeholder-count="5">
        <div style="margin-bottom:2px">
          <button onClick="{{ mod.toggle }}" title="{{ mod.label }}" style="{{ mod.style }}" style-hover="background:var(--hover)">
            <span style="display:flex;flex-shrink:0;color:{{ mod.iconColor }}">{{ mod.icon }}</span>
            <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}">
              <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ mod.label }}</span>
            </sc-if>
            <sc-if value="{{ mod.showCaret }}" hint-placeholder-val="{{ true }}">
              <span style="display:flex;flex-shrink:0;color:var(--hint)">{{ mod.caret }}</span>
            </sc-if>
          </button>
          <sc-if value="{{ mod.open }}" hint-placeholder-val="{{ true }}">
            <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;flex-direction:column;gap:1px;margin:1px 0 4px">
                <sc-for list="{{ mod.cats }}" as="cat" hint-placeholder-count="3">
                  <div>
                    <button onClick="{{ cat.toggle }}" style="{{ cat.style }}" style-hover="background:var(--hover)">
                      <span style="display:flex;flex-shrink:0;color:var(--icon)">{{ cat.icon }}</span>
                      <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ cat.label }}</span>
                      <sc-if value="{{ cat.showCaret }}" hint-placeholder-val="{{ true }}">
                        <span style="display:flex;flex-shrink:0;color:var(--hint)">{{ cat.caret }}</span>
                      </sc-if>
                    </button>
                    <sc-if value="{{ cat.open }}" hint-placeholder-val="{{ true }}">
                      <div style="display:flex;flex-direction:column;gap:1px;margin:1px 0 3px">
                        <sc-for list="{{ cat.items }}" as="acc" hint-placeholder-count="3">
                          <button onClick="{{ acc.select }}" title="{{ acc.label }}" style="{{ acc.style }}" style-hover="background:var(--hover)">
                            <span style="{{ acc.dotStyle }}"></span>
                            <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ acc.label }}</span>
                            <sc-if value="{{ acc.showBadge }}" hint-placeholder-val="{{ false }}">
                              <span style="{{ acc.badgeStyle }}">{{ acc.badge }}</span>
                            </sc-if>
                          </button>
                        </sc-for>
                      </div>
                    </sc-if>
                  </div>
                </sc-for>
              </div>
            </sc-if>
          </sc-if>
        </div>
      </sc-for>
      <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
        <div style="padding:16px 8px;font-size:12px;color:var(--faint)">Sin accesos que coincidan.</div>
      </sc-if>
    </nav>

    <sc-if value="{{ showFooter }}" hint-placeholder-val="{{ true }}">
    <div ref="{{ menuRef }}" style="position:relative;border-top:1px solid var(--border);padding:10px 12px;flex-shrink:0">
      <sc-if value="{{ menuDesktop }}" hint-placeholder-val="{{ false }}">
        <div data-pop="1" style="{{ menuStyle }}">
          <button onClick="{{ closeMenu }}" style="display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 8px;border:0;border-radius:3px;background:transparent;color:var(--item);font-size:13px;font-weight:500;cursor:pointer;text-align:left" style-hover="background:var(--hover)">
            <span style="display:flex;color:var(--icon)">{{ userIcon }}</span><span>Ver mi perfil</span>
          </button>
          <button onClick="{{ setLight }}" style="{{ lightItemStyle }}" style-hover="background:var(--hover)">
            <span style="display:flex">{{ sunIcon }}</span><span>Modo claro</span>
          </button>
          <button onClick="{{ setDark }}" style="{{ darkItemStyle }}" style-hover="background:var(--hover)">
            <span style="display:flex">{{ moonIcon }}</span><span>Modo oscuro</span>
          </button>
          <div style="height:1px;margin:6px 2px;background:var(--border)"></div>
          <button onClick="{{ closeMenu }}" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:34px;padding:0 8px;border:0;border-radius:3px;background:#d9382f;color:#fff;font-size:13px;font-weight:600;cursor:pointer" style-hover="background:#bf2f27">
            <span>Cerrar sesión</span><span style="display:flex">{{ logoutIcon }}</span>
          </button>
        </div>
      </sc-if>
        <sc-if value="{{ notifDesktop }}" hint-placeholder-val="{{ false }}">
          <div data-pop="1" style="{{ notifStyle }}">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)">
              <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--faint)">Notificaciones</span>
              <button onClick="{{ closeNotif }}" style="border:0;background:transparent;padding:0;font-size:12px;font-weight:500;color:var(--accent-text);cursor:pointer">Marcar leídas</button>
            </div>
            <div style="max-height:280px;overflow-y:auto">
              <sc-for list="{{ notifications }}" as="n" hint-placeholder-count="3">
                <button style="display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--border);background:transparent;cursor:pointer;text-align:left" style-hover="background:var(--hover)">
                  <span style="{{ n.dotStyle }}"></span>
                  <span style="flex:1;min-width:0">
                    <span style="{{ n.titleStyle }}">{{ n.title }}</span>
                    <span style="display:block;font-size:11.5px;line-height:16px;color:var(--muted)">{{ n.meta }}</span>
                  </span>
                </button>
              </sc-for>
            </div>
            <button style="display:block;width:100%;padding:9px 12px;border:0;background:transparent;font-size:12.5px;font-weight:600;color:var(--accent-text);cursor:pointer" style-hover="background:var(--hover)">Ver todas</button>
          </div>
        </sc-if>
      <div style="{{ footerRowStyle }}">
        <sc-if value="{{ showFooterButtons }}" hint-placeholder-val="{{ true }}">
        <button data-pop="1" onClick="{{ toggleMenu }}" title="Cuenta" style="position:relative;display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;border:1px solid var(--border);border-radius:3px;background:var(--chip);color:var(--muted);cursor:pointer" style-hover="color:var(--text)">
          {{ avatarIcon }}
          <span style="position:absolute;bottom:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#3fa94b;box-shadow:0 0 0 2px var(--panel)"></span>
        </button>
        </sc-if>
        <sc-if value="{{ railMode }}" hint-placeholder-val="{{ false }}">
          <button data-pop="1" onClick="{{ toggleNotif }}" title="Notificaciones" style="position:relative;display:flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;border:0;border-radius:3px;background:transparent;color:var(--muted);cursor:pointer" style-hover="background:var(--hover);color:var(--text)">
            {{ bellIcon }}
            <span style="position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)"></span>
          </button>
        </sc-if>
        <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ true }}">
          <span style="flex:1;min-width:0">
            <span style="display:block;font-size:12px;font-weight:600;line-height:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Chirito Guerra, Johan</span>
            <span style="display:block;font-size:11px;line-height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Jefe Dpto. de Sistemas</span>
          </span>
          <sc-if value="{{ showFooterButtons }}" hint-placeholder-val="{{ true }}">
            <button data-pop="1" onClick="{{ toggleNotif }}" title="Notificaciones" style="position:relative;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:3px;background:transparent;color:var(--muted);cursor:pointer" style-hover="background:var(--hover);color:var(--text)">
              {{ bellIcon }}
              <span style="position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)"></span>
            </button>
          </sc-if>
        </sc-if>
      </div>
    </div>
    </sc-if>
  </aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <sc-if value="{{ showMenuButton }}" hint-placeholder-val="{{ false }}">
      <header ref="{{ headerRef }}" style="position:relative;display:flex;align-items:center;gap:12px;height:56px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border);flex-shrink:0">
        <button onClick="{{ openDrawer }}" title="Menú" style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;border:1px solid var(--border);border-radius:3px;background:var(--field);color:var(--text);cursor:pointer">{{ menuIcon }}</button>
        <div role="img" aria-label="Andahuasi" style="{{ logoStyle }}"></div>
        <button data-pop="1" onClick="{{ toggleNotif }}" title="Notificaciones" style="position:relative;display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;border:0;border-radius:3px;background:transparent;color:var(--muted);cursor:pointer" style-hover="background:var(--hover);color:var(--text)">
          {{ bellIcon }}
          <span style="position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--panel)"></span>
        </button>
        <button data-pop="1" onClick="{{ toggleMenu }}" title="Cuenta" style="position:relative;display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;border:1px solid var(--border);border-radius:3px;background:var(--chip);color:var(--muted);cursor:pointer" style-hover="color:var(--text)">
          {{ avatarIcon }}
          <span style="position:absolute;bottom:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#3fa94b;box-shadow:0 0 0 2px var(--panel)"></span>
        </button>
        <sc-if value="{{ notifMobile }}" hint-placeholder-val="{{ false }}">
          <div data-pop="1" style="{{ notifStyleMobile }}">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)">
              <span style="font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--faint)">Notificaciones</span>
              <button onClick="{{ closeNotif }}" style="border:0;background:transparent;padding:0;font-size:12px;font-weight:500;color:var(--accent-text);cursor:pointer">Marcar leídas</button>
            </div>
            <div style="max-height:280px;overflow-y:auto">
              <sc-for list="{{ notifications }}" as="n" hint-placeholder-count="3">
                <button style="display:flex;align-items:flex-start;gap:10px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--border);background:transparent;cursor:pointer;text-align:left" style-hover="background:var(--hover)">
                  <span style="{{ n.dotStyle }}"></span>
                  <span style="flex:1;min-width:0">
                    <span style="{{ n.titleStyle }}">{{ n.title }}</span>
                    <span style="display:block;font-size:11.5px;line-height:16px;color:var(--muted)">{{ n.meta }}</span>
                  </span>
                </button>
              </sc-for>
            </div>
            <button style="display:block;width:100%;padding:9px 12px;border:0;background:transparent;font-size:12.5px;font-weight:600;color:var(--accent-text);cursor:pointer" style-hover="background:var(--hover)">Ver todas</button>
          </div>
        </sc-if>
        <sc-if value="{{ menuMobile }}" hint-placeholder-val="{{ false }}">
          <div data-pop="1" style="position:absolute;top:calc(100% - 1px);right:12px;z-index:60;width:224px;padding:6px;border:1px solid var(--border);border-radius:4px;background:var(--panel);box-shadow:0 12px 32px rgba(6,10,11,.22);white-space:nowrap">
            <button onClick="{{ closeMenu }}" style="display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 8px;border:0;border-radius:3px;background:transparent;color:var(--item);font-size:13px;font-weight:500;cursor:pointer;text-align:left" style-hover="background:var(--hover)">
              <span style="display:flex;color:var(--icon)">{{ userIcon }}</span><span>Ver mi perfil</span>
            </button>
            <button onClick="{{ setLight }}" style="{{ lightItemStyle }}" style-hover="background:var(--hover)">
              <span style="display:flex">{{ sunIcon }}</span><span>Modo claro</span>
            </button>
            <button onClick="{{ setDark }}" style="{{ darkItemStyle }}" style-hover="background:var(--hover)">
              <span style="display:flex">{{ moonIcon }}</span><span>Modo oscuro</span>
            </button>
            <div style="height:1px;margin:6px 2px;background:var(--border)"></div>
            <button onClick="{{ closeMenu }}" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:34px;padding:0 8px;border:0;border-radius:3px;background:#d9382f;color:#fff;font-size:13px;font-weight:600;cursor:pointer" style-hover="background:#bf2f27">
              <span>Cerrar sesión</span><span style="display:flex">{{ logoutIcon }}</span>
            </button>
          </div>
        </sc-if>
      </header>
    </sc-if>

    <main style="flex:1;min-height:0;overflow-y:auto;padding:{{ mainPad }}">
      <sc-if value="{{ isItemsScreen }}" hint-placeholder-val="{{ false }}">
        <div style="{{ screenWrapStyle }}">
          <dc-import name="ConfigItemsScreen" theme="{{ themeName }}" compact="{{ isMobileView }}" style="height:100%;width:100%" hint-size="100%,100%"></dc-import>
        </div>
      </sc-if>

          key: c.key, label: c.label, icon: svg(ICONS[c.icon]), open, caret: mkCaret(open),
          toggle: () => this.setState(st => ({ flyClosed: Object.assign({}, st.flyClosed, { [c.key]: !st.flyClosed[c.key] }) })),
          items: list.map(mkAcc)
        };
      }).filter(Boolean);
      const modHit = !fq || this.norm(m.label).indexOf(fq) !== -1;
      if (fq && !modHit && cats.length === 0) return null;
      const open = fq ? true : !this.state.flyClosed[m.key];
      return {
        key: m.key, label: m.label, icon: svg(ICONS[m.icon]), open, caret: mkCaret(open),
        hasCats: m.cats.length > 0, cats,
        toggle: () => this.setState(st => ({ flyClosed: Object.assign({}, st.flyClosed, { [m.key]: !st.flyClosed[m.key] }) }))
      };
    }).filter(Boolean);

    let flyTop = 8;
    if (this.state.flyout) {
      const host = this.asideRef && this.asideRef.current;
      const h = host ? host.getBoundingClientRect().height : 640;
      flyTop = Math.max(8, Math.min(this.state.flyout.top, Math.max(8, h - 260)));
    }

    let activeLabel = 'Panel', activeGroup = '';
    DATA.forEach(m => m.cats.forEach(c => c.items.forEach(it => {
      if (it.key === activeKey) { activeLabel = it.label; activeGroup = m.label; }
    })));
    const allKeys = [];
    DATA.forEach(m => { if (m.cats.length) allKeys.push(m.key); m.cats.forEach(c => allKeys.push(c.key)); });
    const allOpen = allKeys.every(k => openMap[k]);

    return {
      modules, allOpen, noResults: modules.length === 0,
      notifOpen: this.state.notif,
      flyPlaceholder: this.state.flyout && this.state.flyout.key === '__all' ? 'Buscar accesos...' : 'Buscar en el módulo...',
      notifDesktop: this.state.notif && !isMobile,
      notifMobile: this.state.notif && isMobile,
      toggleNotif: () => this.setState(st => ({ notif: !st.notif, menu: false, flyout: null })),
      closeNotif: () => this.setState({ notif: false }),
      notifications: [
        { key:'n1', title:'OT-2418 asignada a ti', meta:'Molienda · hace 12 min', unread:true },
        { key:'n2', title:'Solicitud de trabajo aprobada', meta:'Mantenimiento · hace 1 h', unread:true },
        { key:'n3', title:'Presupuesto de fertilización actualizado', meta:'Paltos · hace 3 h', unread:false },
        { key:'n4', title:'Lectura de contador pendiente', meta:'Planta · ayer', unread:false }
      ].map(n => ({
        title: n.title, meta: n.meta,
        dotStyle: { width:'7px', height:'7px', borderRadius:'50%', flexShrink:0, marginTop:'6px',
          background: n.unread ? 'var(--accent)' : 'transparent', border: n.unread ? 'none' : '1px solid var(--hint)' },
        titleStyle: { display:'block', fontSize:'13px', lineHeight:'18px', fontWeight: n.unread ? 600 : 500, color:'var(--text)', whiteSpace:'normal' }
      })),
      notifStyle: {
        position:'absolute', zIndex:55, width:'320px',
        bottom:'8px', left:'calc(100% - 4px)',
        border:'1px solid var(--border)', borderRadius:'4px', background:'var(--panel)',
        boxShadow:'0 14px 36px rgba(6,10,11,.26)', overflow:'hidden'
      },
      notifStyleMobile: {
        position:'absolute', zIndex:60, width:'292px', top:'calc(100% - 1px)', right:'12px',
        border:'1px solid var(--border)', borderRadius:'4px', background:'var(--panel)',
        boxShadow:'0 14px 36px rgba(6,10,11,.26)', overflow:'hidden'
      },
      asideRef: this.asideRef || (this.asideRef = React.createRef()),
      flyoutOpen: !!(railMode && this.state.flyout),
      flyoutTitle: flySrc ? flySrc.label : '',
      openAllFlyout: e => {
        const r = e.currentTarget.getBoundingClientRect();
        const host = this.asideRef && this.asideRef.current;
        const top = host ? r.top - host.getBoundingClientRect().top : 8;
        const closed = {};
        DATA.forEach(m => { closed[m.key] = true; m.cats.forEach(c => { closed[c.key] = true; }); });
        this.setState(st => ({ flyout: st.flyout && st.flyout.key === '__all' ? null : { key:'__all', top }, flyQuery:'', flyClosed: closed }));
      },
      flyoutCats: flyCats,
      flyAllMode: !!flyAll,
      flyPerModule: !flyAll,
      flyModules,
      flyQuery: this.state.flyQuery,
      onFlyQuery: e => this.setState({ flyQuery: e.target.value }),
      hasFlyQuery: this.state.flyQuery.length > 0,
      clearFlyQuery: () => this.setState({ flyQuery: '' }),
      flyNoResults: flyAll ? flyModules.length === 0 : flyCats.length === 0,
      flyExpandIcon: flyAllOpen ? svg(['M5 9l7-5 7 5','M5 20l7-5 7 5'], {width:15,height:15}) : svg(['M5 4l7 5 7-5','M5 15l7 5 7-5'], {width:15,height:15}),
      toggleFlyAll: () => {
        const closed = {};
        if (flyAll) {
          const everyOpen = flyModules.length > 0 && flyModules.every(m => m.open);
          if (everyOpen) DATA.forEach(m => { closed[m.key] = true; m.cats.forEach(c => { closed[c.key] = true; }); });
        } else if (flyAllOpen) {
          flyCats.forEach(c => { closed[c.key] = true; });
        }
        this.setState({ flyClosed: closed });
      },
      flyoutStyle: {
        position:'absolute', left:'calc(100% - 4px)', top: flyTop + 'px',
        zIndex:50, width:'322px', maxHeight: 'calc(100% - ' + (flyTop + 16) + 'px)',
        display:'flex', flexDirection:'column', overflow:'hidden',
        padding:'8px', border:'1px solid var(--border)', borderRadius:'4px',
        background:'var(--panel)', boxShadow:'0 14px 36px rgba(6,10,11,.26)'
      },
      expandIcon: allOpen ? svg(['M5 9l7-5 7 5','M5 20l7-5 7 5'], {width:15,height:15}) : svg(['M5 4l7 5 7-5','M5 15l7 5 7-5'], {width:15,height:15}),
      toggleAll: () => {
        const next = {};
        if (!allOpen) allKeys.forEach(k => { next[k] = true; });
        this.setState({ expanded: next });
      },
      railModules: modules,
      railMode, showLabels, sidebarStyle, themeStyle,
      primaryStyle: {
        display:'flex', alignItems:'center', justifyContent:'center', gap:'6px',
        height:'32px', width: isMobile ? '32px' : 'auto', padding: isMobile ? '0' : '0 12px',
        border:'1px solid var(--accent)', borderRadius:'3px',
        background:'var(--accent)', color:'var(--accent-fg)',
        fontSize:'13px', fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', flexShrink:0
      },
      logoStyle: {
        flex:1, minWidth:0, width:'100%', height:'24px',
        background: theme === 'dark' ? '#e7ecee' : 'var(--logo, var(--accent-text))',
        WebkitMaskImage:'url(logo-mask.png)', maskImage:'url(logo-mask.png)',
        WebkitMaskRepeat:'no-repeat', maskRepeat:'no-repeat',
        WebkitMaskPosition:'center', maskPosition:'center',
        WebkitMaskSize:'contain', maskSize:'contain'
      },
      query: this.state.query,
      hasQuery: this.state.query.length > 0,
      menuOpen: this.state.menu,
      menuDesktop: this.state.menu && !isMobile,
      menuMobile: this.state.menu && isMobile,
      brandRowStyle: { display: isMobile ? 'none' : 'flex', alignItems:'center', gap:'8px', height:'56px', padding:'0 10px', borderBottom:'1px solid var(--border)', flexShrink:0 },
      footerRowStyle: { display:'flex', alignItems:'center', gap:'8px', flexDirection: railMode ? 'column-reverse' : 'row' },
      menuRef: this.footerRef || (this.footerRef = React.createRef()),
      menuStyle: Object.assign({
        position:'absolute', bottom:'calc(100% - 2px)', zIndex:40, width:'224px',
        padding:'6px', border:'1px solid var(--border)', borderRadius:'4px',
        background:'var(--panel)', boxShadow:'0 12px 32px rgba(6,10,11,.22)',
        whiteSpace:'nowrap'
      }, railMode ? { left:'calc(100% - 4px)', bottom:'8px' } : { left:'10px', right:'10px', width:'auto' }),
      toggleMenu: () => this.setState(s => ({ menu: !s.menu, notif: false, flyout: null })),
      closeMenu: () => this.setState({ menu: false }),
      setLight: () => this.setState({ theme: 'light', menu: false }),
      setDark: () => this.setState({ theme: 'dark', menu: false }),
      lightItemStyle: this.menuItemStyle(theme === 'light'),
      darkItemStyle: this.menuItemStyle(theme === 'dark'),
      avatarIcon: svg(['M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8','M5 20a7 7 0 0 1 14 0'], {width:17,height:17}),
      userIcon: svg(['M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8','M5 20a7 7 0 0 1 14 0'], {width:16,height:16}),
      sunIcon: svg(['M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8','M12 2v2','M12 20v2','M4.2 4.2l1.4 1.4','M18.4 18.4l1.4 1.4','M2 12h2','M20 12h2','M4.2 19.8l1.4-1.4','M18.4 5.6l1.4-1.4'], {width:16,height:16}),
      moonIcon: svg(['M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5'], {width:16,height:16}),
      logoutIcon: svg(['M14 4h5v16h-5','M10 8l-4 4 4 4','M6 12h10'], {width:15,height:15}),
      clearQuery: () => this.setState({ query: '' }),
      closeIcon: svg(['M6 6l12 12','M18 6L6 18'], {width:16,height:16,strokeWidth:2.1}),
      onQuery: e => this.setState({ query: e.target.value }),
      activeLabel, activeGroup,
      isItemsScreen: activeKey === 'p-items', isPlaceholder: activeKey !== 'p-items',
      themeName: theme, isMobileView: isMobile,
      screenWrapStyle: { maxWidth:'1200px', margin:'0 auto', height: isMobile ? 'auto' : '100%' },
      showScrim: isMobile && this.state.drawer,
      showMenuButton: isMobile,
      showDesktopToggle: !isMobile,
      showRailToggle: false,
      toggleStyle: {
        display:'flex', alignItems:'center', justifyContent:'center',
        width:'30px', height:'30px', flexShrink:0,
        margin: railMode ? '0 auto' : '0',
        border:0, borderRadius:'3px', background:'transparent',
        color:'var(--muted)', cursor:'pointer'
      },
      showSecondaryAction: true,
      showSidebarLogo: !isMobile && showLabels,
      showFooter: true,
      showFooterButtons: !isMobile,
      headerRef: this.headerRef || (this.headerRef = React.createRef()),
      showFullCrumbs: !isMobile,
      midCrumb: isMobile ? '…' : activeGroup,
      mainPad: isMobile ? '20px 16px' : '20px 32px',
      toggle: () => this.setState(s => ({ collapsed: s.collapsed === null ? variant !== 'collapsed' : !s.collapsed })),
      openDrawer: () => this.setState({ drawer: true, menu: false, notif: false }),
      closeDrawer: () => this.setState({ drawer: false }),
      searchIcon: svg(['M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14','M20 20l-4-4']),
      chevronIcon: svg(['M8 10l4-4 4 4','M8 14l4 4 4-4'], {width:14,height:14}),
      railIcon: svg(['M4 5h16v14H4z','M10 5v14'], {width:16,height:16}),
      menuIcon: svg(['M4 7h16','M4 12h16','M4 17h16'], {width:18,height:18}),
      bellIcon: svg(['M6 17v-5a6 6 0 1 1 12 0v5','M4 17h16','M10 20h4'], {width:16,height:16}),
      gearIcon: svg(ICONS.cog),
      plusIcon: svg(['M12 5v14','M5 12h14'], {width:14,height:14})
    };
  }
}
